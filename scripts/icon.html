<!doctype html>
<html><body style="margin:0">
<canvas id="c"></canvas>
<script type="module">
  // Renders launcher icons / splash art with the game's own drawing code (used by make-icons.mjs).
  import { blockSprite, drawCat, setSpriteScale, starPath } from '../src/gfx/sprites.ts';
  const font = new FontFace('Vazirmatn', 'url(../src/assets/Vazirmatn.woff2)');
  await font.load();
  document.fonts.add(font);
  setSpriteScale(1);
  window.render = (kind, w, h) => {
    const c = document.getElementById('c');
    c.width = w; c.height = h;
    const ctx = c.getContext('2d');
    ctx.clearRect(0, 0, w, h);
    const s = Math.min(w, h);
    const sky = () => {
      const g = ctx.createLinearGradient(0, 0, w * 0.4, h);
      g.addColorStop(0, '#2b7fd6'); g.addColorStop(1, '#6a3fd1');
      ctx.fillStyle = g; ctx.fillRect(0, 0, w, h);
      // girih stars
      ctx.strokeStyle = 'rgba(255,255,255,0.13)';
      ctx.lineWidth = Math.max(1, s * 0.006);
      const t = s * 0.22;
      for (let y = -t; y < h + t; y += t) for (let x = -t; x < w + t; x += t) { starPath(ctx, x, y, t * 0.38, 0.55, 8, 0); ctx.stroke(); }
      const glow = ctx.createRadialGradient(w / 2, h * 0.45, 0, w / 2, h * 0.45, s * 0.6);
      glow.addColorStop(0, 'rgba(255,230,150,0.45)'); glow.addColorStop(1, 'rgba(255,230,150,0)');
      ctx.fillStyle = glow; ctx.fillRect(0, 0, w, h);
    };
    const blocks = (cx, cy, size) => {
      const b = size / 6.5;
      const spots = [[-3.1, 1.9, 0], [-2.1, 1.9, 1], [-3.1, 0.9, 2], [2.1, 1.9, 5], [1.1, 1.9, 7], [2.1, 0.9, 8], [-3.1, -2.9, 6], [2.1, -2.9, 3]];
      for (const [x, y, col] of spots) ctx.drawImage(blockSprite(col, b), cx + x * b, cy + y * b, b, b);
    };
    const cushion = (cx, cy, r) => {
      const g = ctx.createLinearGradient(0, cy - r * 0.3, 0, cy + r * 0.3);
      g.addColorStop(0, '#e2513f'); g.addColorStop(1, '#8f2219');
      ctx.fillStyle = g;
      ctx.beginPath(); ctx.ellipse(cx, cy, r * 1.3, r * 0.3, 0, 0, Math.PI * 2); ctx.fill();
      ctx.strokeStyle = '#ffcf5a'; ctx.lineWidth = Math.max(1, r * 0.05); ctx.setLineDash([r * 0.12, r * 0.12]);
      ctx.beginPath(); ctx.ellipse(cx, cy - r * 0.02, r * 1.1, r * 0.18, 0, 0, Math.PI * 2); ctx.stroke(); ctx.setLineDash([]);
    };
    if (kind === 'icon' || kind === 'round' || kind === 'store') {
      sky();
      if (kind === 'round') { ctx.globalCompositeOperation = 'destination-in'; ctx.beginPath(); ctx.arc(w / 2, h / 2, s / 2, 0, Math.PI * 2); ctx.fill(); ctx.globalCompositeOperation = 'source-over'; }
      blocks(w / 2, h / 2, s * 0.92);
      cushion(w / 2, h * 0.76, s * 0.26);
      drawCat(ctx, w / 2, h * 0.55, s * 0.25, 1, { lookY: 0.3, shadow: false });
    } else if (kind === 'foreground') {
      blocks(w / 2, h / 2, s * 0.6);
      cushion(w / 2, h * 0.67, s * 0.19);
      drawCat(ctx, w / 2, h * 0.52, s * 0.19, 1, { lookY: 0.3, shadow: false });
    } else if (kind === 'splash') {
      sky();
      cushion(w / 2, h * 0.47 + s * 0.2, s * 0.2);
      drawCat(ctx, w / 2, h * 0.47, s * 0.2, 1, { expr: 'happy', shadow: false });
      ctx.font = `900 ${Math.round(s * 0.14)}px Vazirmatn`;
      ctx.textAlign = 'center';
      ctx.lineJoin = 'round';
      const ty = h * 0.47 + s * 0.45;
      ctx.lineWidth = s * 0.025;
      ctx.strokeStyle = '#4a1f94';
      ctx.strokeText('پیشی پیکسل', w / 2, ty + s * 0.012);
      ctx.strokeStyle = '#6b2fb8';
      ctx.strokeText('پیشی پیکسل', w / 2, ty);
      const g = ctx.createLinearGradient(0, ty - s * 0.1, 0, ty);
      g.addColorStop(0, '#fffbe6'); g.addColorStop(0.6, '#ffd34d'); g.addColorStop(1, '#f29a1a');
      ctx.fillStyle = g;
      ctx.fillText('پیشی پیکسل', w / 2, ty);
    }
    return c.toDataURL('image/png');
  };
  window.ready = true;
</script>
</body></html>
