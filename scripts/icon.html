<!doctype html>
<html><body style="margin:0">
<canvas id="c"></canvas>
<script type="module">
  // Renders launcher icons / splash art with the game's own drawing code (used by make-icons.mjs).
  import { drawCat, drawBlock } from '../src/art.ts';
  const font = new FontFace('Vazirmatn', 'url(../src/assets/Vazirmatn.woff2)');
  await font.load();
  document.fonts.add(font);
  window.render = (kind, w, h) => {
    const c = document.getElementById('c');
    c.width = w; c.height = h;
    const ctx = c.getContext('2d');
    ctx.clearRect(0, 0, w, h);
    const s = Math.min(w, h);
    const bg = () => {
      const g = ctx.createLinearGradient(0, 0, w * 0.3, h);
      g.addColorStop(0, '#ffe3ec'); g.addColorStop(0.5, '#ffc2da'); g.addColorStop(1, '#d9c2ff');
      ctx.fillStyle = g; ctx.fillRect(0, 0, w, h);
    };
    const blocks = (cx, cy, size) => {
      const cols = [0, 1, 2, 5, 7, 8];
      const b = size / 7;
      const spots = [[-3, 2.2], [-2, 2.2], [-3, 1.2], [2, 2.2], [1, 2.2], [2, 1.2], [-3, -2.8], [2, -2.8]];
      spots.forEach(([x, y], i) => drawBlock(ctx, cx + x * b, cy + y * b, b, cols[i % cols.length], 0));
    };
    if (kind === 'icon' || kind === 'round' || kind === 'store') {
      bg();
      if (kind === 'round') { ctx.globalCompositeOperation = 'destination-in'; ctx.beginPath(); ctx.arc(w / 2, h / 2, s / 2, 0, Math.PI * 2); ctx.fill(); ctx.globalCompositeOperation = 'source-over'; }
      blocks(w / 2, h / 2, s * 0.95);
      drawCat(ctx, w / 2, h * 0.56, s * 0.3, 1, -1, {});
    } else if (kind === 'foreground') {
      // adaptive icon: keep art inside the 66% safe zone
      blocks(w / 2, h / 2, s * 0.62);
      drawCat(ctx, w / 2, h * 0.55, s * 0.2, 1, -1, {});
    } else if (kind === 'splash') {
      bg();
      drawCat(ctx, w / 2, h * 0.44, s * 0.2, 1, -1, { happy: true });
      ctx.font = `900 ${Math.round(s * 0.13)}px Vazirmatn`;
      ctx.textAlign = 'center';
      ctx.lineJoin = 'round';
      ctx.lineWidth = s * 0.02;
      ctx.strokeStyle = '#6a35ad';
      ctx.fillStyle = '#6a35ad';
      ctx.fillText('پیشی پیکسل', w / 2, h * 0.44 + s * 0.38);
      ctx.fillStyle = '#fff';
      ctx.fillText('پیشی پیکسل', w / 2, h * 0.44 + s * 0.37);
    }
    return c.toDataURL('image/png');
  };
  window.ready = true;
</script>
</body></html>
