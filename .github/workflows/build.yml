name: Build game

on:
  push:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Test and build Android APKs (Bazaar + Myket)
    runs-on: ubuntu-latest
    env:
      # Store billing keys go into the Android flavors; ad keys into the web build.
      # All optional: without them billing / ads stay switched off.
      BAZAAR_RSA_KEY: ${{ secrets.BAZAAR_RSA_KEY }}
      MYKET_RSA_KEY: ${{ secrets.MYKET_RSA_KEY }}
      VITE_TAPSELL_APP_KEY: ${{ secrets.TAPSELL_APP_KEY }}
      VITE_TAPSELL_REWARDED_ZONE: ${{ secrets.TAPSELL_REWARDED_ZONE }}
      VERSION_CODE: ${{ github.run_number }}
      VERSION_NAME: 1.0.${{ github.run_number }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci
      - run: npm test
      - run: npm run build

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - uses: gradle/actions/setup-gradle@v4

      - name: Release signing key (from secrets, if configured)
        env:
          KEYSTORE_B64: ${{ secrets.MAHALLE_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_B64" ]; then
            echo "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/release.jks"
            echo "MAHALLE_KEYSTORE=$RUNNER_TEMP/release.jks" >> "$GITHUB_ENV"
            echo "Signing with the release key."
          else
            echo "::warning::No MAHALLE_KEYSTORE_BASE64 secret: build is signed with a debug key (OK for testing, not for Bazaar)."
          fi

      - name: Build APKs and AABs
        env:
          MAHALLE_KEYSTORE_PASSWORD: ${{ secrets.MAHALLE_KEYSTORE_PASSWORD }}
          MAHALLE_KEY_ALIAS: ${{ secrets.MAHALLE_KEY_ALIAS }}
          MAHALLE_KEY_PASSWORD: ${{ secrets.MAHALLE_KEY_PASSWORD }}
        run: |
          npx cap sync android
          cd android
          chmod +x gradlew
          ./gradlew --no-daemon assembleBazaarRelease assembleMyketRelease bundleBazaarRelease
          cp app/build/outputs/apk/bazaar/release/app-bazaar-release.apk ../Mahalle.apk
          cp app/build/outputs/apk/myket/release/app-myket-release.apk ../Mahalle-myket.apk
          cp app/build/outputs/bundle/bazaarRelease/app-bazaar-release.aab ../Mahalle.aab

      - uses: actions/upload-artifact@v4
        with:
          name: Mahalle-android
          path: |
            Mahalle.apk
            Mahalle-myket.apk
            Mahalle.aab

      - name: Publish "latest" release (download link for your phone)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete android-latest --yes --cleanup-tag || true
          gh release create android-latest Mahalle.apk Mahalle-myket.apk Mahalle.aab \
            --target "$GITHUB_SHA" \
            --title "محله‌ی ما – latest build (${GITHUB_REF_NAME}, #${{ github.run_number }})" \
            --notes "Install on Android: open this page on your phone, tap **Mahalle.apk**, then open the file and allow installing from this source. New builds install over old ones and keep your progress.

          Mahalle.apk is the Cafe Bazaar build, Mahalle-myket.apk the Myket build. Upload each to its store once it is signed with your release key (see docs/LAUNCH-fa.md).

          Built from commit ${GITHUB_SHA::7}."
